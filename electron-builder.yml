appId: 'oblyviumlauncher'
productName: 'Oblyvium Launcher'
artifactName: 'Oblyvium-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Oblyvium'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  - '!scripts/verify-visual.cjs'
  - '!app/.forja-qa.html'
  - '!scripts/verify-mods.cjs'
  - '!scripts/publish-update.cjs'
  - '!scripts/verify-notifications.cjs'
  - '!app/.notifications-qa.html'
  - '!test/**'
  - '!app/.mods-qa.html'
  - '!ui/**'
  - '!scripts/preview-ui.cjs'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'app/assets/images/OblyviumIcon.ico'
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  icon: 'app/assets/images/OblyviumIcon.png'
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
    # electron-updater reads the zip on macOS; latest-mac.yml points to it.
    - target: 'zip'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Oblyvium-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  icon: 'app/assets/images/OblyviumIcon.png'
  target: 'AppImage'
  maintainer: 'Oblyvium'
  vendor: 'Oblyvium'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Launcher oficial do Oblyvium. Mods, configurações e atualizações são gerenciados automaticamente.'
  category: 'Game'


# Auto update feed, served by launcher-cdn from oblyvium-website.
# Each build writes latest.yml, latest-mac.yml or latest-linux.yml next to the
# installers. Upload the installers and blockmaps first, then the yml, in the
# website's Launcher > Versões do launcher tab.
# Keep in sync with UPDATE_URL in app/assets/js/scripts/uicore.js.
publish:
  provider: 'generic'
  url: 'https://launcher.oblyvium.com.br/updates/'

directories:
  buildResources: 'build'
  output: 'dist'
